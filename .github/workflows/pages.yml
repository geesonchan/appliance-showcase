name: Deploy to GitHub Pages

# Every push to the default branch republishes the site. Nothing else does —
# a pull request builds and type-checks but does not deploy, so what is on the
# link is always what is on the branch.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer push waits rather than cancelling: half a
# site is worse than an old one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Node version is .nvmrc's, the one this machine is held to as well
      # (package.json's engines; src/data/nodeVersion.test.ts). Round 92's
      # first push passed here on Node 24 and failed in CI on Node 20 (D17).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The unit suite, which is the part that does not need a browser. Through
      # its own config, not by narrowing the full one: the full config's global
      # setup starts a preview server for the smoke suite, and on a runner with
      # nothing built yet that is thirty seconds of waiting and then a failure.
      #
      # The smoke suite drives a real Chromium against a real build and takes
      # five minutes. It belongs in a check of its own, not in the path to the
      # link.
      - run: npm run test:unit

      # `npm run build` type-checks first, so a build that publishes is a build
      # that compiled.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
