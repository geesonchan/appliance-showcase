<line x1="35" y1="105" x2="35" y2="572" stroke="#222" stroke-width="10"/>
<rect x="40" y="110" width="168" height="294" fill="none" stroke="#8a7a60" stroke-width="2" stroke-dasharray="6 4"/>
<text x="124" y="348" font-size="13" text-anchor="middle" fill="#6b5b40">盲角柜（台面下）</text>
<text x="355" y="201" font-size="13" text-anchor="middle" fill="#555">后段台面</text>
<text x="127.5" y="502" font-size="13" text-anchor="middle" fill="#555">左段台面</text>
<line x1="40" y1="285" x2="215" y2="285" stroke="#d6249f" stroke-width="5"/>
<text x="271" y="60" font-size="18" font-weight="bold" text-anchor="middle">甲（建议）：接缝横过左段，在后段台面的前边</text>
<rect x="642" y="110" width="462" height="175" fill="#efe9dc" stroke="#555"/>
<rect x="642" y="110" width="175" height="462" fill="#efe9dc" stroke="#555"/>
<rect x="643" y="111" width="173" height="173" fill="#efe9dc"/>
<line x1="637" y1="105" x2="1104" y2="105" stroke="#222" stroke-width="10"/>
<line x1="637" y1="105" x2="637" y2="572" stroke="#222" stroke-width="10"/>
<rect x="642" y="110" width="168" height="294" fill="none" stroke="#8a7a60" stroke-width="2" stroke-dasharray="6 4"/>
<text x="726" y="348" font-size="13" text-anchor="middle" fill="#6b5b40">盲角柜（台面下）</text>
<text x="957" y="201" font-size="13" text-anchor="middle" fill="#555">后段台面</text>
