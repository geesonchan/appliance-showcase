<text x="873" y="60" font-size="18" font-weight="bold" text-anchor="middle">乙：接缝竖在后段上，在左段台面的边上</text>
<text x="271" y="632" font-size="14" text-anchor="middle">后段一块石板从墙到墙；接缝落在盲角柜上面</text>
<text x="873" y="632" font-size="14" text-anchor="middle">左段一块石板到后墙；接缝落在后段第一个柜子的边上</text>
<text x="572" y="667" font-size="14" text-anchor="middle" fill="#d6249f">粉色粗线：接缝。页面上画成台面面上和前边的一条深色细线</text>
</svg>