<svg xmlns="http://www.w3.org/2000/svg" width="1144" height="692" viewBox="0 0 1144 692" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<text x="572" y="28" font-size="20" font-weight="bold" text-anchor="middle">转角的接缝：两种做法（左后角的俯视近景，右后角镜像）</text>
<rect x="40" y="110" width="462" height="175" fill="#efe9dc" stroke="#555"/>
